<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ARTIFACT-START -->
<title>실습 프롬프트 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 클로드 브랜드 팔레트: Dark #141413 · Light #faf9f5 · Light Gray #e8e6dc · Mid Gray #b0aea5
     Orange #d97757 · Blue #6a9bcc · Green #788c5d */
  :root{
    --bg:#FAF9F5;
    --surface:#FFFFFF;
    --ink:#141413;
    --muted:#6E6C64;
    --line:#E8E6DC;
    --accent:#D97757;
    --accent-strong:#C9673F;
    --accent-text:#A94F31;
    --on-accent:#141413;
    --tint:#F3F1EA;
    --tint-line:#E8E6DC;
    --mark:#F4CDB8;
    --shadow:0 1px 2px rgba(20,20,19,.06), 0 10px 28px -14px rgba(20,20,19,.22);
    --orange-ink:#A94F31; --orange-bg:rgba(217,119,87,.16);
    --blue-ink:#3D6B96;   --blue-bg:rgba(106,155,204,.20);
    --green-ink:#56683F;  --green-bg:rgba(120,140,93,.22);
    --gray-ink:#6E6C64;   --gray-bg:rgba(176,174,165,.24);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#141413;
      --surface:#1F1E1B;
      --ink:#FAF9F5;
      --muted:#B0AEA5;
      --line:#34322D;
      --accent:#D97757;
      --accent-strong:#E48B6D;
      --accent-text:#E9A68F;
      --on-accent:#141413;
      --tint:#262521;
      --tint-line:#3A3833;
      --mark:#7A3F28;
      --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -14px rgba(0,0,0,.7);
      --orange-ink:#E9A68F; --orange-bg:rgba(217,119,87,.22);
      --blue-ink:#A7C6E6;   --blue-bg:rgba(106,155,204,.22);
      --green-ink:#B3C29A;  --green-bg:rgba(120,140,93,.26);
      --gray-ink:#C9C7BE;   --gray-bg:rgba(176,174,165,.20);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141413;
    --surface:#1F1E1B;
    --ink:#FAF9F5;
    --muted:#B0AEA5;
    --line:#34322D;
    --accent:#D97757;
    --accent-strong:#E48B6D;
    --accent-text:#E9A68F;
    --on-accent:#141413;
    --tint:#262521;
    --tint-line:#3A3833;
    --mark:#7A3F28;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -14px rgba(0,0,0,.7);
    --orange-ink:#E9A68F; --orange-bg:rgba(217,119,87,.22);
    --blue-ink:#A7C6E6;   --blue-bg:rgba(106,155,204,.22);
    --green-ink:#B3C29A;  --green-bg:rgba(120,140,93,.26);
    --gray-ink:#C9C7BE;   --gray-bg:rgba(176,174,165,.20);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{transition:none!important;animation:none!important}
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:16px/1.65 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent-text)}
  button{font:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

  .page{max-width:1160px;margin:0 auto;padding:0 24px 96px}

  /* ── header ─────────────────────────────── */
  .top{padding:44px 0 22px;display:grid;gap:22px}
  .brand{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .brand-text{display:grid;gap:8px}
  .eyebrow{font-size:13px;font-weight:500;letter-spacing:.04em;color:var(--accent-text)}
  .brand h1{
    font-family:"Gowun Batang","Noto Serif KR",serif;
    font-weight:700;
    font-size:clamp(32px,4.2vw,44px);
    line-height:1.2;
    letter-spacing:-.01em;
    margin:0;
    text-wrap:balance;
  }
  .brand p{margin:0;color:var(--muted);font-size:15.5px;max-width:52ch}
  .stats{display:flex;gap:18px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stats b{color:var(--ink);font-weight:700;font-size:20px;font-family:"Gowun Batang",serif;margin-right:3px}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .search{flex:1 1 320px;position:relative;min-width:0}
  .search svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted);pointer-events:none}
  .search input{
    width:100%;
    padding:13px 44px 13px 42px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--surface);
    color:var(--ink);
    font-size:15.5px;
    box-shadow:var(--shadow);
  }
  .search input::placeholder{color:var(--muted)}
  .search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
  .search .clear{
    position:absolute;right:8px;top:50%;translate:0 -50%;
    width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;
    display:none;place-items:center;
  }
  .search .clear:hover{background:var(--tint);color:var(--ink)}
  .search.has-value .clear{display:grid}
  .kbd{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--surface)}
  .theme{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);cursor:pointer;font-size:14px;font-weight:500;
  }
  .theme:hover{border-color:var(--accent)}
  .theme svg{width:17px;height:17px}
  .theme .sun{display:none}
  :root[data-theme="dark"] .theme .moon{display:none}
  :root[data-theme="dark"] .theme .sun{display:block}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .theme .moon{display:none}
    :root:not([data-theme="light"]) .theme .sun{display:block}
  }
  .result-line{font-size:14px;color:var(--muted);min-height:1.5em}
  .result-line b{color:var(--ink);font-weight:600}

  /* ── layout ─────────────────────────────── */
  .layout{display:grid;grid-template-columns:236px minmax(0,1fr);gap:44px;align-items:start;margin-top:8px}
  .toc{position:sticky;top:20px;display:grid;gap:2px;max-height:calc(100vh - 40px);overflow:auto;padding:6px 0}
  .toc-title{font-size:12.5px;letter-spacing:.06em;color:var(--muted);padding:6px 10px 8px;font-weight:500}
  .toc a{
    display:flex;gap:10px;align-items:center;
    padding:8px 10px;border-radius:10px;
    color:var(--muted);text-decoration:none;font-size:14px;line-height:1.35;
    transition:background .15s,color .15s;
  }
  .toc a .n{
    flex:none;width:26px;height:26px;border-radius:8px;
    display:grid;place-items:center;
    font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;
    background:var(--surface);border:1px solid var(--line);color:var(--muted);
  }
  .toc a:hover{color:var(--ink);background:color-mix(in srgb,var(--surface) 70%,transparent)}
  .toc a.active{color:var(--ink);background:var(--surface);box-shadow:var(--shadow);font-weight:600}
  .toc a.active .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .toc a[hidden]{display:none}

  main{max-width:800px;min-width:0}

  /* ── lesson section ─────────────────────── */
  .lesson{padding:30px 0 10px;scroll-margin-top:16px}
  .lesson:first-child{padding-top:10px}
  .lesson-head{
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line);
  }
  .lesson-no{
    font-family:"Gowun Batang",serif;font-weight:700;font-size:30px;line-height:1;
    color:var(--accent-text);font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .lesson-no small{font-size:16px;margin-left:1px}
  .lesson-title{
    font-family:"Gowun Batang",serif;font-weight:700;font-size:23px;line-height:1.3;margin:0;
    text-wrap:balance;
  }
  .lesson-title .sub{font-family:"Noto Sans KR",sans-serif;font-weight:400;font-size:15px;color:var(--muted);margin-left:8px;white-space:nowrap}
  .lesson-meta{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;white-space:nowrap}
  .tag{
    display:inline-flex;align-items:center;
    padding:3px 9px;border-radius:999px;
    font-size:12.5px;font-weight:600;letter-spacing:.01em;
  }
  .tag.orange{color:var(--orange-ink);background:var(--orange-bg)}
  .tag.blue{color:var(--blue-ink);background:var(--blue-bg)}
  .tag.green{color:var(--green-ink);background:var(--green-bg)}
  .tag.gray{color:var(--gray-ink);background:var(--gray-bg)}

  /* ── prompt card ────────────────────────── */
  .cards{display:grid;gap:14px}
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 18px 16px;
    transition:box-shadow .2s,border-color .2s;
  }
  .card:hover{box-shadow:var(--shadow)}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
  .card-label{font-weight:700;font-size:15.5px;line-height:1.5;word-break:keep-all}
  .card-label .kind{
    display:inline-block;margin-left:8px;padding:1px 7px;border-radius:6px;
    font-size:11.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);vertical-align:2px;
  }
  .copy{
    flex:none;display:inline-flex;align-items:center;gap:6px;
    padding:8px 13px;border-radius:9px;
    border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);
    font-size:13.5px;font-weight:600;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .copy svg{width:15px;height:15px}
  .copy .ic-check{display:none}
  .copy:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
  .copy.done{background:var(--tint);color:var(--accent-text);border-color:var(--tint-line)}
  .copy.done .ic-copy{display:none}
  .copy.done .ic-check{display:block}
  .prompt{
    margin:0;
    background:var(--tint);
    border:1px solid var(--tint-line);
    border-radius:10px;
    padding:14px 16px;
    font:inherit;
    font-size:16px;line-height:1.8;
    white-space:pre-wrap;
    word-break:keep-all;
    overflow-wrap:anywhere;
  }
  .card.plain .prompt{background:transparent;border-style:dashed;color:var(--muted)}
  .notes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .note{
    display:inline-flex;align-items:flex-start;gap:7px;
    font-size:13.5px;line-height:1.5;color:var(--muted);
    border:1px dashed var(--line);border-radius:9px;padding:6px 11px;
    word-break:keep-all;overflow-wrap:anywhere;
  }
  .note svg{flex:none;width:14px;height:14px;margin-top:4px}
  .note.attach{border-style:solid;background:color-mix(in srgb,var(--surface) 60%,var(--bg))}
  .note a{color:inherit;text-decoration:underline;text-underline-offset:2px}

  .empty{
    display:none;
    margin-top:40px;padding:36px 24px;text-align:center;
    border:1px dashed var(--line);border-radius:14px;color:var(--muted);
  }
  .empty b{color:var(--ink)}
  .page.no-results .empty{display:block}

  footer{margin-top:64px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:grid;gap:6px}
  footer p{margin:0}

  .toast{
    position:fixed;left:50%;bottom:28px;translate:-50% 20px;
    background:var(--ink);color:var(--bg);
    padding:11px 16px;border-radius:11px;font-size:14px;font-weight:500;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;
    transition:opacity .2s,translate .2s;
    max-width:calc(100vw - 32px);
  }
  .toast.show{opacity:1;translate:-50% 0}

  .totop{
    position:fixed;right:22px;bottom:22px;width:42px;height:42px;border-radius:12px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
    display:grid;place-items:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .totop.show{opacity:1;pointer-events:auto}
  .totop svg{width:18px;height:18px}

  /* ── narrow screens ─────────────────────── */
  @media (max-width:900px){
    .page{padding:0 16px 80px}
    .top{padding:28px 0 14px}
    .layout{grid-template-columns:1fr;gap:10px}
    .toc{
      position:sticky;top:0;z-index:5;
      display:flex;gap:8px;overflow-x:auto;max-height:none;
      padding:10px 0;margin:0 -16px;padding-left:16px;padding-right:16px;
      background:var(--bg);
      scrollbar-width:none;
    }
    .toc::-webkit-scrollbar{display:none}
    .toc-title{display:none}
    .toc a{flex:none;padding:6px 10px 6px 6px;border:1px solid var(--line);background:var(--surface);font-size:13px}
    .toc a.active{box-shadow:none;border-color:var(--accent)}
    .lesson{scroll-margin-top:64px}
    .lesson-meta{margin-left:0}
    .card{padding:16px 14px 14px}
    .card-head{flex-wrap:wrap}
    .prompt{font-size:15.5px;padding:12px 14px}
    .kbd{display:none}
  }

  @media print{
    .toolbar,.toc,.copy,.toast,.totop,.kbd{display:none!important}
    .layout{grid-template-columns:1fr}
    .card{break-inside:avoid;box-shadow:none}
    .lesson{break-before:auto}
    body{background:#fff;color:#000}
  }
</style>
</head>
<body>
<div class="page" id="page">
  <header class="top">
    <div class="brand">
      <div class="brand-text">
        <div class="eyebrow"><strong>교사들을 위한 클로드 사용법</strong></div>
        <h1>실습 프롬프트 모음</h1>
        <p>연수에서 함께 실습할 프롬프트를 차시별로 모았습니다. <br>복사 버튼을 누르고 클로드 입력창에 붙여넣어 사용해 보세요.</p>
      </div>
      <div class="stats" aria-label="전체 규모">
        <span><b id="stat-lessons">0</b>차시</span>
        <span><b id="stat-prompts">0</b>개 프롬프트</span>
      </div>
    </div>
    <div class="toolbar">
      <label class="search" id="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="프롬프트 검색 (예: 노션, 세특, 모둠, 가정통신문)" autocomplete="off" aria-label="프롬프트 검색">
        <button class="clear" id="clear" type="button" aria-label="검색어 지우기">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </label>
      <span class="kbd" title="키보드 단축키">/ 키로 검색</span>
      <button class="theme" id="theme" type="button" aria-label="화면 모드 전환">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>화면 모드</span>
      </button>
    </div>
    <div class="result-line" id="result-line" aria-live="polite"></div>
  </header>

  <div class="layout">
    <nav class="toc" id="toc" aria-label="차시 목차">
      <div class="toc-title">차시 바로가기</div>
    </nav>
    <main id="main">
      <div class="empty" id="empty"></div>
      <footer>
        <p>복사한 프롬프트는 클로드 입력창에 붙여넣은 뒤 그대로 보내거나, 선생님 상황에 맞게 고쳐 쓰세요.</p>
        <p>프롬프트 안의 OO, [ ] 자리는 담당 과목이나 학교 상황으로 바꾸고, 학생 실명이나 개인정보는 넣지 않습니다.</p>
      </footer>
    </main>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<button class="totop" id="totop" type="button" aria-label="맨 위로">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
/* ────────────────────────────────────────────────────────────
   프롬프트 데이터
   - label  : 카드 제목 (원문 그대로)
   - prompt : 복사되는 프롬프트 본문 (원문 그대로)
   - attach : 첨부 안내 (복사 대상 아님)
   - notes  : 참고 안내 (복사 대상 아님)
   - kind   : 'info' | 'mission' 이면 복사 버튼 없음
   ──────────────────────────────────────────────────────────── */
// 태그 색: 클로드 브랜드 강조색 3가지 + 회색
//  orange = 클로드 앱 기능 / blue = 외부 연결·업무 적용 / green = 에이전트 작업 / gray = 총정리
const TAG_COLOR = {
  '채팅':'orange', '프로젝트':'orange', '아티팩트':'orange', '디자인':'orange', '스킬':'orange',
  '커넥터':'blue', '생기부':'blue',
  '코워크':'green', '코드':'green',
  '리터러시':'gray'
};

const SESSIONS = [
  { no:1, title:'클로드 시작하기', tag:'채팅', items:[
    { label:'① 첫 질문 시연 (도입부 30초 시연)',
      prompt:`중학교 1학년 첫 수업에서 쓸 5분짜리 아이스브레이킹 활동을 3개 추천해줘.` },
    { label:'② 설정 - 클로드 지침에 넣을 내용',
      prompt:`나는 고등학교에서 OO과목을 가르치는 교사입니다. 수업과 학교 업무에 클로드를 사용합니다. 수업 관련 요청에는 학생이 이해하기 쉬운 표현으로, 업무 관련 요청에는 간결하고 격식 있는 문장으로 답변해 주세요.`,
      notes:['담당 과목 이름만 바꿔 쓰도록 안내. 3줄에서 5줄 분량. 학교 이름, 학생 실명, 개인정보는 넣지 않습니다.'] },
    { label:'③ 음성 입력 시연 (화면 구성 설명 중)',
      prompt:`이번 주 금요일 종례 때 학생들에게 해줄 만한 짧은 이야기 하나 추천해줘.` }
  ]},

  { no:2, title:'클로드 채팅과 좋은 답변 얻는 기술', tag:'채팅', items:[
    { label:'① 실습1. 수업 설계 프롬프트',
      prompt:`너는 고1 학생들에게 로봇과 공학세계를 가르치는 교사야.학기 첫 시간 수업을 설계해줘. 학생들이 즐겁게 참여하는 재미있는 수업을 하고 싶어. 장소는 공학실이고 학기 첫 수업이야. 학생들은 로봇을 어려워하고 생소해 해. 수업시간 50분에 맞춰줘. 너무 타이트하지 않게 여유롭게 진행해줘.`,
      attach:['교과서 캡처본 첨부'] },
    { label:'② 실습1. 수정 요청',
      prompt:`활동이 우리 학생들한테는 좀 어려울 것 같아. 처음 만나는 시간이니까 서로 알아가는 요소를 넣어서 다시 제안해줘.` },
    { label:'③ 실습2. 업무 기획 프롬프트',
      prompt:`너는 고등학교 정보부장이야. AI 디지털 선도학교를 신청하려고 하는데, 사업을 함께 기획해줘.
우리 학교는 32학급이고 학생 700명, 교사 70여 명이야. 교사들이 AI를 활용해 다양한 수업을 시도할 수 있게 돕고 싶고, 학생들에게는 생활기록부에 남을 만한 양질의 프로그램을 운영하고 싶어.
다른 학교와 차별되게 기획하고 싶어. 뻔한 내용은 아니었으면 좋겠어.
바로 기획안을 만들지 말고, 먼저 나에게 필요한 질문을 해줘. 그 답변을 반영해서 기획해줘.`,
      attach:['공문 첨부'] }
  ]},

  { no:3, title:'클로드 프로젝트', tag:'프로젝트', items:[
    { label:'① 실습1. 수업설계 도우미 프로젝트 지침',
      prompt:`너는 고등학교 로봇과 공학세계 교사를 돕는 수업 설계 도우미야. 고1 학생 수준에 맞게, 이론보다 실습과 활동 중심으로 수업을 설계해줘. 매 차시는 50분 기준이고, 도입 5분, 활동 35분, 정리 10분 구조를 기본으로 해줘.` },
    { label:'② 실습2. 시험문제출제 프로젝트 지침 생성 요청',
      prompt:`나는 중학교 3학년 일반사회를 가르치는 교사야.
시험문제 출제를 도와주는 클로드 프로젝트 지침을 만들어줘.
내가 [교과서, 수업자료, 학습지 등]을 제공하면, 그것을 분석해서 시험문제와 답, 해설까지 함께 나오도록 만들어줘.
바로 지침을 만들지 말고, 먼저 필요한 질문을 나에게 해줘. 그 답변을 참고해서 완성도 높은 프로젝트 지침을 만들어줘.` },
    { label:'③ 실습3. 프로젝트 지침 생성 프로젝트 지침',
      prompt:`너는 클로드 프로젝트 지침을 만들어주는 메타 프롬프트 제작 전문가야. 사용자가 만들고 싶은 프로젝트를 설명하면, 바로 지침을 만들지 말고 먼저 필요한 정보를 질문해서 물어봐주고 그 답변을 받은 뒤, 그 내용을 반영해 완성도 높은 프로젝트 지침을 만들어주는 메타 프롬프트 지침을 만들어줘.` }
  ]},

  { no:4, title:'클로드 아티팩트와 시각화', tag:'아티팩트', items:[
    { label:'① 실습1. 모둠 짜기 앱 첫 요청',
      prompt:`학생 번호를 입력하면 원하는 모둠 수만큼 무작위로 팀을 만들어주는 앱을 만들어줘. 번호는 1번부터 원하는 숫자까지 범위로 지정할 수 있게 해줘.` },
    { label:'② 실습1. 다듬기 1 (디자인과 분위기)',
      prompt:`디자인을 좀더 밝고 역동적으로 해주고 모둠을 뽑을 때 팡팡 터지는 소리도 나게 해줘.` },
    { label:'③ 실습1. 다듬기 2 (실제 업무 기능)',
      prompt:`학년과 반을 입력하는 곳이 있었으면 좋겠고 그 결과를 이미지로 다운로드 받아서 내가 보관했으면 좋겠어.` },
    { label:'④ 실습2. 수요와 공급 시뮬레이터',
      prompt:`중2 사회 수요와 공급의 법칙을 배우는 시뮬레이터를 만들어줘. 학생들이 조작하며 원리를 이해할 수 있게 만들어줘.` },
    { label:'⑤ 실습3. 교사 복무 지침 안내 웹사이트',
      prompt:`우리 학교 교사 복무 지침 문서를 업로드할 테니, 조퇴, 외출, 연가, 병가, 시간외 근무 등에 대해 선생님들이 쉽게 이해할 수 있게 안내하는 웹사이트를 만들어줘.` },
    { label:'⑥ 실습4. 피타고라스 정리 시각화',
      prompt:`피타고라스 정리를 중학생들이 쉽게 이해할 수 있게 시각화해줘.` }
  ]},

  { no:5, title:'클로드 디자인', tag:'디자인', items:[
    { label:'① 준비 단계 - 디자인 시스템에 학교 정체성 등록',
      prompt:`우리 학교 정보야. 앞으로 이 디자인 시스템으로 만드는 모든 자료에 이 내용을 기준으로 삼아줘.
우리 학교가 학부모님께 말할 때의 어조는 이렇게 잡아줘. 격식은 갖추되 어렵지 않게, 문장은 짧게, 학교가 무엇을 해드리겠다는 쪽으로 써줘.
교표는 새로 그리거나 변형하지 말고, 내가 올린 파일 그대로 써줘.`,
      attach:['학교 정보 첨부'] },
    { label:'② 준비 단계 - 디자인 시스템 다듬기',
      prompt:`우리 학교 주색은 교표의 남색으로 고정하고, 강조색은 교표 안의 금색을 써줘.
학부모님과 어르신들이 읽으실 자료가 많으니 본문 글자 크기를 한 단계 키우고, 배경과 글자의 명암 차이를 충분히 확보해줘.` },
    { label:'③ 실습1. 학부모 총회 안내 책자 표지',
      prompt:`너는 학교 홍보물을 만드는 디자이너야.
첨부한 총회 계획서를 보고 2027학년도 학부모 총회 안내 책자 표지를 만들어줘. 행사명과 일시, 장소는 파일에서 가져다 쓰고, 확실하지 않은 건 임의로 채우지 말고 물어봐.
총회 당일 학부모님께 나눠드릴 책자야. 신뢰감이 느껴지되 딱딱하지 않으면 좋겠어.
크기는 A4 세로야. 한 장에 꽉 차게, 아래가 휑하게 비어 보이지 않도록 균형을 잡아줘. 교표는 상단에, 표지에는 그 외 정보를 넣지 말아줘.
표지 아래 부제 한 줄은 등록해둔 우리 학교 교훈과 비전에서 뽑아서 제안해줘.
시안을 세 가지로 보여줘.` },
    { label:'④ 실습2. 게시용 포스터',
      prompt:`같은 학부모 총회의 게시용 포스터를 만들어줘.
학교 현관과 복도에 붙일 거라, 지나가면서 3초 안에 무슨 행사인지, 언제인지, 어디인지 이 세 가지가 읽혀야 해.
크기는 A4 세로, 멀리서도 읽히게 글자를 크게 해줘. 세부 일정은 넣지 말고, 자세한 내용은 QR 코드로 안내한다는 문구와 QR 자리만 비워서 표시해줘.
맨 위 짧은 문구 한 줄은 우리 학교 교훈이나 비전과 이어지는 말로 뽑아줘.
인쇄할 거니까 가장자리에 여백을 충분히 남겨줘.
시안 두 가지를 보여줘.` },
    { label:'⑤ 실습2. 포스터 검토 요청',
      prompt:`이 포스터를 복도 3미터 거리에서 봤을 때 읽히는지, 글자와 배경의 명암 차이가 충분한지 검토하고 고쳐야 할 부분을 알려줘.` },
    { label:'⑥ 실습3. 총회 발표용 슬라이드',
      prompt:`같은 총회 1부에서 강당 화면에 띄울 안내 슬라이드를 만들어줘.
다섯 장으로 해줘. 표지, 오늘 일정, 학년별 교실 위치, 주차와 문의처, 마무리 인사.
강당 뒷자리에서도 읽혀야 하니 한 장에 한 가지만 담고 글자를 크게 해줘. 설명은 발표자가 할 거니까 화면에는 핵심만 남겨줘.
화면 비율은 16대 9로.` },
    { label:'⑦ 실습3. 모든 결과물 다운로드',
      prompt:`지금까지 제작한 모든 결과물을 알집으로 묶어서 다운로드 해줘.` }
  ]},

  { no:6, title:'클로드 스킬', tag:'스킬', items:[
    { label:'① 실습1. 공문 안내 스킬 만들기',
      prompt:`교육청 공문을 우리 학교 선생님들께 보낼 메신저 안내 문구로 바꿔주는 스킬을 만들어줘.
공문 PDF나 이미지를 올리면 핵심만 뽑아 짧고 읽기 쉬운 안내문으로 만들어주고, 마감일이 있으면 맨 위에 강조해줘.
바로 만들지 말고, 먼저 필요한 질문을 나에게 해줘. 그 답변을 반영해서 완성도 높은 스킬을 만들어줘.` },
    { label:'② 실습1. 스킬 호출 (평소 말투로)',
      prompt:`공문을 메시지로` },
    { label:'③ 실습1. 스킬 수정 요청',
      prompt:`제목은 [  ]안에 넣어주고 마지막에는 늘 ‘감사합니다’라는 문구로 끝나게 스킬을 업데이트해줘.` },
    { label:'④ 실습2. 학교 양식을 넣은 가정통신문 스킬',
      prompt:`우리 학교 가정통신문 공식 양식 파일을 첨부할 개. 이 양식 그대로 가정통신문을 만들어주는 스킬을 만들어줘.
먼저 필요한 질문을 해주고, 그 답을 반영해서 스킬을 완성해줘.` },
    { label:'⑤ 실습2. 완성된 스킬 사용',
      prompt:`체험학습 가정통신문 만들어줘. 내용은 너가 알아서 채워줘.` }
  ]},

  { no:7, title:'클로드 커넥터 1 (드라이브, 캘린더, 캔바, 노션)', tag:'커넥터', items:[
    { label:'① 실습1. 상담 시간표 짜기 (드라이브 + 시간표 이미지)',
      prompt:`내 구글 드라이브에서 '학부모 상담 신청 명단' 스프레드시트를 찾아서 읽어줘. 함께 업로드하는 다음 주 수업 시간표 이미지를 참고해서 내 수업 시간과 겹치지 않게 상담 시간표를 짜주면 돼. 우리 학교 일과는 1교시가 9시 10분에 시작하고, 수업은 50분, 쉬는 시간은 10분, 점심시간은 1시간이야. 이 일정에 맞춰서 학부모님들이 희망하신 시간대를 최대한 반영해 줘. 상담은 한 건당 20분씩 진행하고, 각 상담 사이에는 10분씩 여유를 둬서 배정해 줘. 작성된 일정은 내 캘린더에 바로 등록하지 말고, 내가 먼저 확인할 수 있게 표로 정리해서 보여줘.` },
    { label:'② 실습1. 캘린더 등록 (확인 후 2단계)',
      prompt:`좋아. 이 시간표대로 내 캘린더에 일정을 등록해줘. 일정 제목은 '학생 학번(학부모 상담)' 형식으로 해줘.` },
    { label:'③ 실습2. 1단계 슬라이드 개요 받기 (고1 국어 현대시)',
      prompt:`다음 시간에 수업할 교과서 내용이야. 이 시로 고1 대상 50분 수업을 하려고 해. 교사가 해석을 먼저 알려주는 방식 말고 학생들이 스스로 의미를 찾아가는 활동 중심으로 도입 5분, 활동 35분, 정리 10분 흐름을 잡고, 그 흐름대로 학생들에게 보여줄 슬라이드 10장 개요를 만들어줘.` },
    { label:'④ 실습2. 2단계 캔바로 넘기기',
      prompt:`이 개요 그대로 캔바에서 수업용 프레젠테이션으로 만들어줘. 고등학교 국어 수업에 쓸 자료니까 너무 화려하지 않고 글씨가 잘 보이는 스타일로 해줘. 시 본문이 들어가는 장은 여백을 넉넉하게 잡아줘.` },
    { label:'⑤ 실습3. 1단계 노션 업무 DB 만들기',
      prompt:`내 노션에 학교 공문 업무를 관리할 DB를 하나 만들어줘. 이름은 '공문 업무 DB'로 해줘. 앞으로 여기에 교육청 공문에서 뽑은 할 일을 쌓아둘 거야. 공문 업무를 관리하는 데 필요한 항목은 네가 판단해서 넣어줘.` },
    { label:'⑥ 실습3. 2단계 공문에서 할 일 추출',
      prompt:`이 공문을 읽고 내가 처리해야 할 일을 뽑아줘.
각 항목마다 할 일 제목, 마감일, 담당 부서, 우선순위를 정리해줘. 마감일이 이번 주 안이면 우선순위를 높음으로 해줘.
먼저 정리한 내용을 보여주고, 내가 확인하면 노션의 '정보부 업무 DB'에 등록해줘.` },
    { label:'⑦ 실습3. 노션 등록 승인',
      prompt:`맞아. 노션 ‘공문 업무 DB’에 등록해줘.` }
  ]},

  { no:8, title:'클로드 커넥터 2 (PLAY MCP, 힉스필드)', tag:'커넥터', items:[
    { label:'① 실습1. PLAY MCP로 진로 상담 자료 만들기 (한 번에 시키기)',
      prompt:`고1 학생 진로 상담 자료를 만들려고 해.
네이버 데이터랩으로 최근 3년간 '로봇', '휴머노이드' 검색어 트렌드를 확인하고 관련 최신 뉴스도 5건 찾아줘. 오픈다트에서는 레인보우로보틱스와 두산로보틱스의 직원 수, 평균 근속연수, 1인 평균 급여를 표로 비교하고, 임원들이 어떤 경력을 거쳐 그 자리에 갔는지도 정리해줘.
찾은 내용을 상담용 자료로 정리해서 docx 파일로 만들어줘. 검색어 트렌드 요약, 뉴스, 회사 비교표, 학생에게 던질 질문 순서로 담고, 출력해서 상담할 때 옆에 두고 쓸 거니까 두세 쪽이면 좋겠어.
그리고 핵심만 추려서 카카오톡으로도 나에게 보내줘. 복도에서 폰으로 볼 거라 200자 안으로 짧게.` },
    { label:'② 실습2. 1단계 이미지 먼저 만들기',
      prompt:`힉스필드를 활용해서 영어 수업 도입에 쓸 그림을 만들어줘. 한 학생이 아침에 늦잠을 자서 침대에서 벌떡 일어나 시계를 보고 놀라는 장면이야. 밝고 단순한 일러스트로, 글자는 넣지 마.` },
    { label:'③ 실습2. 1단계 이미지 다듬기',
      prompt:`시계가 더 잘 보이게 해줘.` },
    { label:'④ 실습2. 2단계 계획과 크레딧 먼저 받기',
      prompt:`이 그림으로 5초짜리 영상을 만들려고 해. 학생이 벌떡 일어나 시계를 보고 놀라는 움직임이 보이게. 짧은 영어 나레이션도 음성으로 넣을 거야.
바로 만들지 말고 계획을 먼저 보여줘. 크레딧이 얼마나 드는지, 지금 내 잔액으로 가능한지도 알려줘. 내가 좋다고 하면 그때 실행해줘.` },
    { label:'⑤ 실습2. 2단계 실행 승인',
      prompt:`좋아. 이대로 진행해줘.`,
      notes:['참고: 커스텀 커넥터 연결 정보 — 이름: 힉스필드 / 주소: https://mcp.higgsfield.ai/mcp'] }
  ]},

  { no:9, title:'클로드 코워크 1 (폴더정리, 자료종합)', tag:'코워크', items:[
    { label:'① 설정 - 전역 지시사항',
      prompt:`나는 고등학교 교사이고 00부장을 맡고 있어.
작업을 시작하기 전에 반드시 무엇을 어떻게 할지 계획을 먼저 보여주고 내 확인을 받아줘.
파일을 지우거나 원본을 덮어쓰지 마. 바꿔야 할 게 있으면 사본을 만들어서 작업해줘.
확실하지 않은 숫자나 사실은 추측해서 채우지 말고 확인이 필요하다고 표시해줘.` },
    { label:'② 실습1. 공문 폴더 정리하기',
      prompt:`이 폴더에 다운로드받은 공문 파일들이 정리 없이 쌓여 있어. 본문 파일과 첨부파일이 섞여 있어.
먼저 파일을 하나씩 열어서 어떤 공문의 본문인지, 어떤 공문의 첨부인지 확인해줘. 본문에 적힌 붙임 목록을 근거로 짝을 지어줘.
공문 하나마다 폴더를 만들어서 정리해줘.
폴더 이름은 '시행일_공문제목' 형식으로 해줘.
어느 공문 것인지 판단이 안 되는 파일은 억지로 넣지 말고 '확인필요' 폴더에 따로 모아줘.
파일은 절대 지우지 말고 이동만 해줘. 작업 시작하기 전에 어떻게 묶을 계획인지 먼저 보여줘.` },
    { label:'③ 실습2. 자료 종합 및 정리하기',
      prompt:`이 폴더는 내가 모아둔 AI 관련 자료야. 전체 내용을 파악할 수 있게 정리 보고서로 만들어줘. 순서대로 해줘.
첫째, 폴더 안의 파일을 전부 읽고 각 자료가 뉴스 기사인지 논문인지 정책 자료인지, 언제 나온 것인지 표로 먼저 보여줘.
둘째, 파일 기준이 아니라 주제 기준으로 다시 묶어줘. 주제는 자료를 읽고 네가 뽑아서 제안해줘.
셋째, 모든 항목에 어느 파일에서 가져왔는지 출처를 적어줘. 내 자료에 없는 내용은 네가 알고 있는 걸로 채우지 마.
넷째, 이 내용을 워드 파일로 만들어줘. 맨 앞에 한 쪽짜리 요약, 뒤에 주제별 상세 내용을 넣어줘. 원문을 길게 옮기지 말고 요약해서 쓰고 출처는 남겨줘.` }
  ]},

  { no:10, title:'클로드 코워크 2 (빈칸 채우기, 채점 근거, 자료 리서치)', tag:'코워크', items:[
    { label:'① 실습1. 1단계 읽히고 계획 받기 (교수학습 운영계획)',
      prompt:`이 폴더에 파일이 세 개 있어. 1학기 교수학습 운영계획은 다 작성된 예시야. 2학기 교수학습 운영계획은 아직 비어 있는 양식이고, 2학기 수업 계획은 내가 정리한 진도 자료야.
세 파일을 다 읽고, 2학기 양식을 어떻게 채울지 계획을 먼저 보여줘.
1학기 문서에서 각 열을 어떤 방식으로 채웠는지, 내 수업 계획의 단원을 몇 주 차에 배정할 생각인지 표로 알려줘. 개학일은 8월 18일, 지필평가는 10월 넷째 주와 12월 둘째 주야. 시험 주에는 진도를 넣지 마.
아직 파일은 만들지 말고 계획을 보여줘.` },
    { label:'② 실습1. 2단계 채우게 하기',
      prompt:`계획대로 진행해줘. 단원 3과 4의 순서만 바꿔서 배정해줘.
2학기 양식 파일에 내용을 채워서 새 파일로 저장해줘. 원본 양식은 그대로 두고.
표 형식과 문장 어투는 1학기 문서와 똑같이 맞춰줘. 내 수업 계획에 없는 내용은 지어내지 말고, 반영 비율이나 평가 시기처럼 내가 판단해야 하는 자리는 비워두고 '교사 확인 필요'라고 표시해줘.
마지막에 총 수업 주수와 배정한 주수가 맞는지 계산해서 알려줘.` },
    { label:'③ 실습2. 1단계 기준표부터 읽히기',
      prompt:`이 폴더에 논술 답안 다섯 편과 평가기준표가 있어. 기준표만 먼저 읽고, 수준을 가르는 기준이 뭔지 정리해줘. 이 기준으로 답안을 비교할 때 애매해질 만한 지점도 알려줘. 답안은 아직 읽지 마.` },
    { label:'④ 실습2. 2단계 우열과 근거 받기',
      prompt:`이제 다섯 편을 비교해서 우열 순서와 그렇게 본 이유를 써줘. 등급은 매기지 말고. 이유에는 답안 문장을 요약하지 말고 원문 그대로 인용해줘. 정하기 어려운 쌍은 억지로 정하지 말고 판단 어려움으로 표시해줘.
결과는 엑셀로 만들고, 맨 끝에 교사 최종 순위 열을 빈 칸으로 넣어줘.` },
    { label:'⑤ 실습3. 1단계 손으로 한 번 돌리기 (수업자료 리서치)',
      prompt:`로봇 분야 최신 뉴스를 웹에서 최근 일주일 이내 기사로 세 건 찾아줘.
각 기사를 고1이 이해할 수 있게 다섯 줄 이내로 풀어 쓰고, 뉴스마다 수업에서 던질 발문을 한 줄씩 붙여줘. 기사마다 원문 링크와 날짜, 언론사를 표시해줘.
수업 시간에 띄우게 HTML 파일로 만들어서 이 폴더에 저장해 주고 구글 드라이브 수업자료 폴더에도 저장해줘.` },
    { label:'⑥ 실습3. 2단계 예약 걸기',
      prompt:`이 작업을 매주 월수금 오전 9시에 반복해줘.` }
  ]},

  { no:11, title:'클로드 코워크 3 (기능 종합, 라이브 아티팩트)', tag:'코워크', items:[
    { label:'① 실습1. 인물 소개 수업 자료 (요청문 하나로)',
      prompt:`고1 학생들 수업 도입부에 쓸 인물 소개 자료를 만들어줘. 순서대로 해줘.
첫째, 학생들에게 롤모델이 될 만한 인물 세 명을 선정해줘. 국내 인물을 최소 한 명 넣고, 분야는 서로 겹치지 않게 해줘. 구글 드라이브 인물자료 폴더를 먼저 확인해서 이전에 다룬 인물과 겹치지 않게 해줘.
둘째, 조사를 시작하기 전에 어떤 인물을 왜 골랐는지, 어떤 순서로 진행할지 계획을 먼저 보여주고 내 확인을 받아줘.
셋째, 서브에이전트를 세 개 띄워서 한 명씩 맡아 웹 검색으로 독립적으로 조사하게 해줘. 각각 같은 형식으로 채워줘. 인물 소개 세 줄, 학생이 흥미를 느낄 구체적인 장면 하나, 그 사람이 겪은 실패나 좌절 하나, 학생에게 남길 메시지 한 줄. 장면은 연도와 상황이 드러나게 쓰고 출처 링크를 남겨줘.
넷째, 작성된 내용 전체를 사실관계에 부합하는지 스스로 검증해줘. 연도, 숫자, 인용한 말, 일화를 앞에서 쓴 자료가 아닌 다른 출처로 교차 확인하고, 확인된 것과 출처마다 다른 것과 확인이 안 되는 것으로 나눠 표로 알려줘. 확인이 안 되는 내용은 지우거나 고치지 말고 그대로 두고 표시만 해줘.
다섯째, 인물 소개 슬라이드 스킬을 써서 인물별 PPT를 만들고, 인물 소개 프로젝트에 올리고 구글 드라이브 인물자료 폴더(폴더 링크)에도 저장해줘. 파일 이름은 '인물소개_인물명_날짜' 형식으로.` },
    { label:'② 실습1. 계획 단계에서 고치기',
      prompt:`후보의 직군이 한쪽에 몰려 있어. 분야를 더 섞어줘. 나머지는 그대로 진행해.` },
    { label:'③ 실습1. 예약으로 승격',
      prompt:`매주 월요일 오전 7시에 이 작업을 반복해줘.`,
      notes:['아래에 위 요청문 전체를 그대로 붙여넣기'] },
    { label:'④ 실습2. 교사 업무 대시보드 (라이브 아티팩트)',
      prompt:`커넥터 4개와 시간표를 합쳐, 향후 1주일 업무를 한 화면에서 파악하는 교사 업무 대시보드를 라이브 아티팩트로 구성해줘.
캘린더는 오늘부터 7일치 일정을 주간 그리드 모양 그대로 보여주고, 지메일은 최근 3일간 안 읽은 메일과 읽었지만 답장하지 않은 메일을 광고성만 빼고 가져와줘.
노션 ‘정보부 공문 업무 DB’에서는 완료되지 않은 항목을 마감일이 빠른 순으로 올리고, 구글 드라이브는 최근 작업한 파일 5개만 표시해줘.
시간표는 이미지로 첨부할 테니 읽어서 한쪽에 고정해줘.
데이터는 미리 넣어두지 말고 화면이 열릴 때 커넥터를 직접 호출해서 채우되, 섹션별로 따로 불러와서 하나가 실패해도 나머지는 정상적으로 보이게 만들어줘.
한눈에 대시보드를 파악할 수 있게 디자인도 현대적이고 세련되게 구성해줘.` }
  ]},

  { no:12, title:'클로드 코드 (바이브 코딩)', tag:'코드', items:[
    { label:'① 실습 계획 모드로 요청하기',
      prompt:`중학교 3학년 과학에서 학생들이 매년 어려워하는 원리 다섯 가지, 화학 반응과 질량 보존, 구름이 만들어지는 과정, 역학적 에너지의 전환, 유전 확률, 별의 연주 시차를 직접 움직여보는 시뮬레이터 실험실 사이트로 만들어줘.` },
    { label:'② 계획 확인 후 실행',
      prompt:`좋아, 이 계획대로 만들어줘.` },
    { label:'③ 다듬기',
      prompt:`글씨를 전체적으로 키우고, 각 실험 화면 위쪽에 이 실험에서 무엇을 관찰해야 하는지 한두 문장으로 넣어줘. 그리고 첫 화면에 학교 이름 대신 중3 과학 원리 실험실이라고 제목을 넣어줘.` },
    { label:'④ 배포하기',
      prompt:`이 사이트를 버셀에 배포해줘.` }
  ]},

  { no:13, title:'클로드와 생기부 쓰기1 (프로젝트 활용)', tag:'생기부', items:[
    { label:'① 실습1 세특 작성 프로젝트 지침 만들기',
      prompt:`[역할] 너는 교과세특 작성 프롬프트를 설계하는 전문가야. 나는 (○○고등학교)에서 (1)학년 (로봇과 공학세계) 과목을 가르치는 교사야.
[목표] 내가 교과세특을 작성할 때 쓸 클로드 프로젝트 지침을 만들어줘.
[인풋과 아웃풋 설명] 학생의 결과물(보고서, PPT, 발표 녹음 텍스트)과 나의 관찰 기록을 주면 자료를 분석해 학생의 역량과 탐구 스토리를 파악하고, 형용사보다 동사, 결과보다 과정, 완벽함보다 성장이 드러나도록 구체적 근거를 들어 작성한 세특 문단을 주는거야.
[수업 설명] 나의 수업은 학생이 교과서를 읽고 궁금한 질문을 스스로 찾은 뒤 AI와 함께 깊이 탐구하고, 보고서와 발표 PPT를 만들어 친구들 앞에서 발표하는 수업이야.
[지침에 반드시 넣을 규칙]

* 교사가 직접 관찰한 시점으로 서술 (지어내지 않기, 학생의 느낌이나 생각으로 서술하지 않기)
* 피동 서술형 종결어미 사용 (~됨, ~보임, ~받음, ~임), 주어 생략
* 가운데점 사용 금지
* 논문, 도서출간, 인증시험 성적, 교외대회 실적, 특정 기관명이나 상호명 등 기재 금지 사항 제외

[질문요청]

1. 바로 지침을 쓰지 말고, 지침을 완성하는 데 꼭 필요한 정보를 5~7개 질문으로 한 번에 물어봐. 각 질문에는 번호와 예시 답변을 함께 달아줘.
2. 답변이 모두 모이면 최종 프로젝트 지침을 코드블록으로 출력해줘. 내가 바로 복사해 프로젝트 지침란에 붙여넣을 수 있는 형태여야 해.` },
    { label:'② 실습2 완성도 높은 지침으로 바꿔 쓰기', kind:'info',
      prompt:`따로 제공` }
  ]},

  { no:14, title:'클로드와 생기부 쓰기2 (코워크 활용)', tag:'생기부', items:[
    { label:'① 실습1 데이터 정리 스킬 만들기',
      prompt:`너는 학생 수행평가 자료를 정리하는 데이터 정리 전문가야.
[목적] 교과세특을 작성하기 전에, 흩어져 있는 학생 수행평가 결과물을 학생별로 모아 엑셀 파일 하나로 정리하는 스킬을 만들어줘.
[입력] 한 폴더에 섞여 있는 학생 결과물 (보고서, 발표자료, 사진, 텍스트 등) 교사의 관찰 기록이나 평가 메모
[출력] 엑셀 파일 1개 (시트 1개) 한 행에 한 학생, 학번 순 정렬, 열 구성: 수행결과물에 따라 적절하게 구성
[규칙] 학생이 쓴 내용은 요약하거나 다듬지 말고 원문 그대로 옮길 것 자료에 없는 내용은 절대 만들어내지 말 것 해당 자료가 없으면 빈칸으로 두거나 '자료 없음'이라고 표기할 것 학생에 대한 평가나 판단은 하지 말 것 (세특 작성은 다음 단계)` },
    { label:'② 실습2 스킬로 학생 결과물 정리하기',
      prompt:`이 폴더에 있는 학생 자료를 데이터 정리 스킬을 사용해서 학번 순으로 정리해줘. 자료가 없거나 어느 학생 것인지 확인이 안 되는 자료는 따로 표시해줘.` },
    { label:'③ 실습3 교과세특 한 번에 쓰기',
      prompt:`정리된 엑셀 파일을 근거로 교과세특 작성 스킬을 사용해서 전체 학생의 세특 초안을 작성해줘. 파일에 있는 내용만 근거로 쓰고, 근거가 없는 학생은 초안을 만들지 말고 부족한 자료를 알려줘.` }
  ]},

  { no:15, title:'총정리 및 AI 리터러시', tag:'리터러시', items:[
    { label:'참고. 한도 갱신 시점을 앞당기는 예약 작업 (미션)', kind:'mission',
      prompt:`코워크에 아침 일곱 시 예약 작업을 걸어 세션을 자동으로 시작시키기` }
  ]}
];

/* ────────────────────────────────────────────────────────────
   렌더링
   ──────────────────────────────────────────────────────────── */
const ICON_COPY  = '<svg class="ic-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const ICON_CHECK = '<svg class="ic-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>';
const ICON_CLIP  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 11.5-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.8-8.8a3.5 3.5 0 0 1 5 5l-8.8 8.8a1.5 1.5 0 0 1-2.1-2.1L16 6.7"/></svg>';
const ICON_INFO  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>';

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const splitTitle = t => { const m = t.match(/^(.*?)\s*(\(.*\))\s*$/); return m ? {main:m[1], sub:m[2]} : {main:t, sub:''}; };

function highlight(text, q){
  if(!q) return esc(text);
  const lower = text.toLowerCase(), ql = q.toLowerCase();
  let out = '', i = 0, idx;
  while((idx = lower.indexOf(ql, i)) !== -1){
    out += esc(text.slice(i, idx)) + '<mark>' + esc(text.slice(idx, idx + q.length)) + '</mark>';
    i = idx + q.length;
  }
  return out + esc(text.slice(i));
}

const main = document.getElementById('main');
const toc = document.getElementById('toc');
const emptyBox = document.getElementById('empty');
const cardIndex = []; // {el, session, item, promptEl, labelEl}

let promptCount = 0;
SESSIONS.forEach(s => {
  const {main: tMain, sub: tSub} = splitTitle(s.title);
  const copyable = s.items.filter(i => !i.kind).length;
  promptCount += copyable;

  const sec = document.createElement('section');
  sec.className = 'lesson';
  sec.id = 'lesson-' + s.no;
  sec.innerHTML = `
    <div class="lesson-head">
      <div class="lesson-no">${s.no}<small>차시</small></div>
      <h2 class="lesson-title">${esc(tMain)}${tSub ? `<span class="sub">${esc(tSub)}</span>` : ''}</h2>
      <div class="lesson-meta">
        <span class="tag ${TAG_COLOR[s.tag] || 'gray'}">${esc(s.tag)}</span>
        <span class="count">${copyable ? copyable + '개 프롬프트' : '참고'}</span>
      </div>
    </div>
    <div class="cards"></div>`;
  const cards = sec.querySelector('.cards');

  s.items.forEach(it => {
    const card = document.createElement('article');
    card.className = 'card' + (it.kind ? ' plain' : '');
    const kindLabel = it.kind === 'info' ? '안내' : it.kind === 'mission' ? '미션' : '';
    const notes = [
      ...(it.attach || []).map(a => `<span class="note attach">${ICON_CLIP}<span>${esc(a)}</span></span>`),
      ...(it.notes  || []).map(n => `<span class="note">${ICON_INFO}<span>${linkify(n)}</span></span>`)
    ].join('');
    card.innerHTML = `
      <div class="card-head">
        <div class="card-label">${esc(it.label)}${kindLabel ? `<span class="kind">${kindLabel}</span>` : ''}</div>
        ${it.kind ? '' : `<button class="copy" type="button" aria-label="프롬프트 복사">${ICON_COPY}${ICON_CHECK}<span>복사</span></button>`}
      </div>
      <pre class="prompt">${esc(it.prompt)}</pre>
      ${notes ? `<div class="notes">${notes}</div>` : ''}`;
    const btn = card.querySelector('.copy');
    if(btn){
      btn.addEventListener('click', async () => {
        const ok = await copyText(it.prompt);
        if(ok){
          btn.classList.add('done'); btn.querySelector('span').textContent = '복사됨';
          showToast('프롬프트를 복사했어요. 클로드 입력창에 붙여넣기 하세요.');
          setTimeout(() => { btn.classList.remove('done'); btn.querySelector('span').textContent = '복사'; }, 1800);
        }else{
          showToast('복사가 막혔어요. 프롬프트 글을 직접 드래그해서 복사해 주세요.');
        }
      });
    }
    cards.appendChild(card);
    cardIndex.push({
      el: card, session: s, item: it,
      promptEl: card.querySelector('.prompt'),
      labelEl: card.querySelector('.card-label'),
      hay: (s.title + ' ' + it.label + ' ' + it.prompt + ' ' + (it.attach||[]).join(' ') + ' ' + (it.notes||[]).join(' ')).toLowerCase()
    });
  });

  main.insertBefore(sec, emptyBox);

  const a = document.createElement('a');
  a.href = '#lesson-' + s.no;
  a.dataset.target = sec.id;
  a.innerHTML = `<span class="n">${s.no}</span><span>${esc(tMain)}</span>`;
  toc.appendChild(a);
});

document.getElementById('stat-lessons').textContent = SESSIONS.length;
document.getElementById('stat-prompts').textContent = promptCount;

/* ── 검색 ─────────────────────────────────── */
const searchEl = document.getElementById('search');
const searchWrap = document.getElementById('search-wrap');
const resultLine = document.getElementById('result-line');
const page = document.getElementById('page');

function applySearch(){
  const q = searchEl.value.trim();
  searchWrap.classList.toggle('has-value', q.length > 0);
  let shown = 0;
  const perSection = new Map();
  cardIndex.forEach(c => {
    const hit = !q || c.hay.includes(q.toLowerCase());
    c.el.hidden = !hit;
    if(hit){
      shown++;
      perSection.set(c.session.no, (perSection.get(c.session.no) || 0) + 1);
    }
    // 하이라이트는 검색 중일 때만 (평소엔 원문 그대로)
    const kindEl = c.labelEl.querySelector('.kind');
    c.labelEl.innerHTML = highlight(c.item.label, q) + (kindEl ? kindEl.outerHTML : '');
    c.promptEl.innerHTML = highlight(c.item.prompt, q);
  });
  SESSIONS.forEach(s => {
    const visible = (perSection.get(s.no) || 0) > 0;
    document.getElementById('lesson-' + s.no).hidden = !visible;
    toc.querySelector(`a[data-target="lesson-${s.no}"]`).hidden = !visible;
  });
  page.classList.toggle('no-results', shown === 0);
  if(!q){
    resultLine.innerHTML = `${SESSIONS.length}차시 · 복사할 수 있는 프롬프트 <b>${promptCount}개</b>`;
  }else{
    resultLine.innerHTML = `‘<b>${esc(q)}</b>’ 검색 결과 <b>${shown}개</b>`;
    emptyBox.innerHTML = `‘<b>${esc(q)}</b>’에 맞는 프롬프트가 없어요.<br>다른 단어로 찾아보거나 검색어를 지우면 전체 목록이 다시 보입니다.`;
  }
}
searchEl.addEventListener('input', applySearch);
document.getElementById('clear').addEventListener('click', () => { searchEl.value = ''; applySearch(); searchEl.focus(); });
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || '');
  if(e.key === '/' && !typing){ e.preventDefault(); searchEl.focus(); searchEl.select(); }
  if(e.key === 'Escape' && document.activeElement === searchEl){ searchEl.value = ''; applySearch(); }
});
applySearch();

/* ── 복사 ─────────────────────────────────── */
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly','');
  ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  ta.remove();
  return ok;
}

const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

/* ── 목차 스크롤 스파이 ────────────────────── */
const tocLinks = [...toc.querySelectorAll('a')];
const sections = SESSIONS.map(s => document.getElementById('lesson-' + s.no));
function setActive(id){
  tocLinks.forEach(a => a.classList.toggle('active', a.dataset.target === id));
  const active = toc.querySelector('a.active');
  if(active && window.matchMedia('(max-width:900px)').matches){
    active.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
  }
}
if('IntersectionObserver' in window){
  const visible = new Map();
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => visible.set(en.target.id, en.isIntersecting ? en.boundingClientRect.top : Infinity));
    let best = null, bestTop = Infinity;
    sections.forEach(sec => {
      if(sec.hidden) return;
      const top = visible.get(sec.id);
      if(top !== undefined && top !== Infinity){
        const d = Math.abs(top - 120);
        if(d < bestTop){ bestTop = d; best = sec.id; }
      }
    });
    if(best) setActive(best);
  }, {rootMargin:'-10% 0px -60% 0px', threshold:[0, 0.1, 0.5]});
  sections.forEach(sec => io.observe(sec));
}
setActive('lesson-1');

/* ── 화면 모드 ────────────────────────────── */
const root = document.documentElement;
const themeBtn = document.getElementById('theme');
try{
  const saved = localStorage.getItem('prompt-theme');
  if(saved === 'dark' || saved === 'light') root.dataset.theme = saved;
}catch(e){}
themeBtn.addEventListener('click', () => {
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const current = root.dataset.theme || (systemDark ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  try{ localStorage.setItem('prompt-theme', next); }catch(e){}
});

/* ── 맨 위로 ─────────────────────────────── */
const totop = document.getElementById('totop');
window.addEventListener('scroll', () => totop.classList.toggle('show', window.scrollY > 600), {passive:true});
totop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
</script>
